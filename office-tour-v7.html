<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIKKE AI LABO | 仮想本社 Ver.7</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#edf7ff;background:#04132d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0%,#1258a5 0%,#04132d 52%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 5%;border-bottom:1px solid #39bfff;background:#061d41}h1{font-size:clamp(19px,4vw,32px);margin:0}small{color:#7de6ff}.wrap{max-width:1300px;margin:auto;padding:25px 4%}.intro{margin:0 0 18px;color:#b4d7f3}.floors{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0 22px}button{font:inherit;cursor:pointer}.floor{padding:12px 22px;border:1px solid #4cb9ff;border-radius:12px;background:#082953;color:white}.floor.active{background:#0579c9;box-shadow:0 0 17px #00bfff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.room{padding:0;text-align:left;overflow:hidden;border:1px solid #398cd6;border-radius:16px;background:#082445;color:#fff;transition:transform .15s}.room:hover,.room:focus-visible{transform:translateY(-3px);outline:2px solid #73e8ff}.room img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:linear-gradient(125deg,#073c70,#0f85b2,#071b3d)}.room .txt{padding:14px}.num{color:#6ee8ff;font-weight:800;margin-right:7px}.room p{font-size:13px;color:#a7cde8;margin:5px 0 0}.viewer{margin-top:25px;border:1px solid #4bcaff;border-radius:18px;overflow:hidden;background:#071e3e;box-shadow:0 0 22px #0077aa55}.viewer-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;gap:10px}.viewer h2{margin:0;font-size:20px}.viewer img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#031126;display:block;max-height:75vh}.detail{padding:16px 20px;color:#c9e7fa}.nav{display:flex;gap:9px;padding:0 20px 18px}.nav button{flex:1;padding:12px;background:#0d4979;color:white;border:1px solid #44bfff;border-radius:10px}.notice{color:#8db8d6;font-size:13px;margin-top:24px}footer{text-align:center;padding:25px;color:#7da6ca}@media(max-width:720px){.grid{grid-template-columns:1fr}.room img{aspect-ratio:16/8}.wrap{padding:18px 4%}.viewer h2{font-size:17px}}</style></head><body><header><h1>♞ HIKKE AI LABO <small>仮想本社 Ver.7</small></h1><span>🏢 OFFICE TOUR</span></header><main class="wrap"><p class="intro">フロアを選び、部屋をタップして見学できます。</p><div class="floors" id="floors"></div><div class="grid" id="rooms"></div><section class="viewer" id="viewer" aria-live="polite"><div class="viewer-head"><h2 id="roomTitle"></h2><span id="floorTag"></span></div><img id="big" alt="室内の完成イメージ"><div class="detail" id="detail"></div><div class="nav"><button id="prev">← 前の部屋</button><button id="next">次の部屋 →</button></div></section><p class="notice">※ 完成画像は「room-01.jpg .PNG」～「room-09.jpg」の名前で、このHTMLと同じ場所にアップロードしてください。画像が未登録の場合は代替表示になります。360°撮影データは含まれていないため、この版は写真見学です。</p></main><footer>HIKKE AI LABO © 2026</footer><script>const data=[{n:1,f:1,t:'受付・ラウンジ',d:'来訪者を迎える、白とシアンブルーを基調としたエントランス。'},{n:2,f:1,t:'品質管理室',d:'公開前の文章・画像・リンクなどをチェックする品質管理エリア。'},{n:3,f:1,t:'販売管理室',d:'営業状況やプロジェクト進捗を管理するオフィス。'},{n:4,f:2,t:'リサーチ室',d:'調査・比較・情報収集に集中する個室型リサーチエリア。'},{n:5,f:2,t:'SNS運用室',d:'SNSの企画、制作、投稿管理を行うクリエイティブな空間。'},{n:6,f:2,t:'データ分析室',d:'分析結果や指標を可視化し、改善案を検討するエリア。'},{n:7,f:3,t:'企画会議室',d:'新しいアイデアや制作計画を話し合う会議スペース。'},{n:8,f:3,t:'記事制作室',d:'記事・画像・動画などのコンテンツ制作に取り組む部屋。'},{n:9,f:3,t:'社長室',d:'黒を基調に青い照明を配した、落ち着いたラグジュアリー空間。'}];let floor=1,selected=1;const $=id=>document.getElementById(id);const file=n=>'room-'+String(n).padStart(2,'0')+'.jpg';function fallback(img,n){img.onerror=null;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#08284e"/><text x="640" y="315" text-anchor="middle" fill="#6be5ff" font-size="54" font-family="sans-serif">HIKKE AI LABO</text><text x="640" y="410" text-anchor="middle" fill="white" font-size="42" font-family="sans-serif">${data[n-1].t}</text><text x="640" y="480" text-anchor="middle" fill="#9cc" font-size="26" font-family="sans-serif">画像アップロード待ち</text></svg>`)}function render(){ $('floors').innerHTML=[1,2,3].map(f=>`<button class="floor ${f===floor?'active':''}" data-f="${f}">${f}F　${['','受付・管理','運用・分析','企画・制作'][f]}</button>`).join('');$('floors').querySelectorAll('button').forEach(b=>b.onclick=()=>{floor=+b.dataset.f;selected=data.find(x=>x.f===floor).n;render()});$('rooms').innerHTML=data.filter(x=>x.f===floor).map(x=>`<button class="room" data-n="${x.n}"><img src="${file(x.n)}" alt="${x.t}"><div class="txt"><strong><span class="num">${String(x.n).padStart(2,'0')}</span>${x.t}</strong><p>${x.d}</p></div></button>`).join('');$('rooms').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.n;show();$('viewer').scrollIntoView({behavior:'smooth',block:'start'})});$('rooms').querySelectorAll('img').forEach(img=>img.onerror=()=>fallback(img,+img.closest('button').dataset.n));show()}function show(){const x=data[selected-1];$('roomTitle').textContent=`${x.n}. ${x.t}`;$('floorTag').textContent=x.f+'F';$('detail').textContent=x.d;const img=$('big');img.onerror=()=>fallback(img,x.n);img.src=file(x.n)}$('prev').onclick=()=>{selected=selected===1?9:selected-1;floor=data[selected-1].f;render()};$('next').onclick=()=>{selected=selected===9?1:selected+1;floor=data[selected-1].f;render()};render();</script></body></html>
