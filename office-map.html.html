<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HIKKE AI LABO 仮想本社 Ver.7 立体マップ統合版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#153c5d;background:#edf8ff}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{background:linear-gradient(110deg,#063a69,#087cb7);color:white;padding:22px 18px;border-radius:0 0 22px 22px}header small{color:#b6eaff;letter-spacing:2px}header h1{font-size:25px;margin:7px 0}header p{margin:0;font-size:12px;color:#d2f2ff}.wrap{max-width:1080px;margin:auto;padding:16px}.tabs,.floors{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.tabs button,.floors button{border:1px solid #b5dced;background:white;color:#155276;border-radius:12px;padding:11px 14px;white-space:nowrap;font-weight:650}.tabs button.active,.floors button.active{background:#0a7db6;color:white;border-color:#0a7db6}.panel{background:white;border:1px solid #cfe7f5;border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:0 5px 22px #217eac10}.roomgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.room{min-height:105px;border:1px solid #a9d7eb;border-radius:14px;background:#f5fbff;color:#165579;padding:10px 5px;font-weight:700}.room.active{border:2px solid #0a88c5;background:#c7edff}.room span{display:block;font-size:23px;margin-bottom:9px}.roomname{font-weight:800;font-size:19px;margin:8px 0 12px}.hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:15px;display:block}.sub{font-size:12px;color:#68899f}.staffgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.person{background:#f4fbff;border:1px solid #b8deee;border-radius:13px;padding:7px;color:#174d6b;font-weight:700}.person.active{background:#c9eeff;border:2px solid #078bc8}.person img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px}.profile{display:grid;grid-template-columns:120px 1fr;gap:15px;align-items:start}.profile img{width:120px;height:150px;object-fit:cover;border-radius:12px}.profile h2{margin:2px 0 6px}.pill{display:inline-block;background:#e1f5ff;border-radius:100px;padding:5px 10px;color:#08618e;font-size:12px}.action{background:#0786bd;color:white;border:0;border-radius:12px;padding:13px 17px;font-weight:700;width:100%;margin-top:12px}.task{padding:9px 0;border-bottom:1px solid #e5f0f7}.task:before{content:'✓';color:#0889bd;margin-right:9px}textarea{width:100%;min-height:130px;border:1px solid #a9d7eb;border-radius:12px;padding:12px;font:inherit}footer{text-align:center;color:#7b99ac;font-size:12px;padding:18px}#notice{font-size:12px;color:#68899f}@media(min-width:760px){.layout{display:grid;grid-template-columns:340px 1fr;gap:14px}.profile{grid-template-columns:160px 1fr}.profile img{width:160px;height:190px}}

/* Ver.7 architectural floor visualization */
.archmap{position:relative;min-height:270px;background:linear-gradient(155deg,#d6f4ff,#f9fdff 55%,#b2e5f7);border-radius:18px;overflow:hidden;padding:24px 12px 32px;margin:14px 0;box-shadow:inset 0 0 0 1px #a8dbea}
.archmap:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 27px,#fff8 28px),repeating-linear-gradient(90deg,transparent 0 27px,#fff8 28px);transform:skewY(-10deg) scale(1.3);pointer-events:none}
.maplabel{position:relative;z-index:1;font-size:12px;color:#12678e;font-weight:800;margin-bottom:16px}
.isofloor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;transform:perspective(620px) rotateX(27deg) rotateZ(-8deg);transform-origin:center center;position:relative;z-index:1;margin:10px 8px 30px}
.isoroom{position:relative;min-height:125px;background:linear-gradient(140deg,#fff,#d6f5ff);border:2px solid #76bfdc;border-bottom:12px solid #7ac3e0;border-right:10px solid #91d4eb;border-radius:7px;box-shadow:7px 10px 0 #3c98c944,0 15px 18px #337d9e22;color:#165878;padding:12px 5px;font-weight:800;font-size:12px;transition:filter .15s,transform .15s;overflow:hidden}
.isoroom:before{content:"";position:absolute;top:7px;left:8px;right:8px;height:29px;background:repeating-linear-gradient(90deg,#9edbf0 0 20%,#fff 20% 24%);border:2px solid #a1d5e8;border-radius:4px;opacity:.7}
.isoroom .emoji{display:block;font-size:30px;margin:31px 0 6px;filter:drop-shadow(0 2px 2px #24789a33)}
.isoroom.selected{background:linear-gradient(130deg,#e1faff,#93dafa);border-color:#0786c1;box-shadow:8px 12px 0 #1286b877,0 0 0 3px #3db5ed55}
.isoroom:active{transform:translateY(3px)}
.roomscene{position:relative;min-height:240px;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#d4f2ff 0%,#f7fcff 50%,#e0f6ff 51%,#b7e1f2 100%);border:1px solid #b3ddec;margin-top:12px}
.scene-window{height:125px;margin:15px 18px 0;border:7px solid #fff;border-radius:8px;background:linear-gradient(#87d9ff,#e9f9ff 78%);box-shadow:0 3px 15px #1b78a92b;position:relative}
.scene-window:after{content:"";position:absolute;bottom:0;left:0;right:0;height:42px;background:repeating-linear-gradient(90deg,#83c3dc 0 15px,#d5edf7 15px 26px,#a6d4e7 26px 38px);clip-path:polygon(0 80%,10% 45%,18% 60%,28% 20%,40% 66%,52% 15%,66% 53%,77% 30%,90% 65%,100% 22%,100% 100%,0 100%);opacity:.7}
.scene-desk{position:relative;margin:-4px auto 0;width:78%;height:45px;border-radius:50%;background:linear-gradient(#fefefe,#b5dff0);border:5px solid #78b9d3;box-shadow:0 21px 0 -7px #7bbcd6,0 25px 16px #427fa54d;display:flex;justify-content:space-around;align-items:center}
.scene-desk i{font-style:normal;font-size:25px;position:relative;top:-6px}
.scene-title{position:absolute;top:15px;left:25px;background:#ffffffde;border-radius:10px;padding:7px 10px;color:#12577f;font-weight:800;font-size:12px}
.scene-tag{font-size:11px;color:#537f98;margin-top:8px}
.roompeople{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.roompeople button{min-width:86px;max-width:104px;flex:1;border:1px solid #b7ddec;border-radius:12px;background:#f1fbff;padding:6px;font-weight:700;color:#19587b}
.roompeople img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block;margin-bottom:6px}
@media(max-width:440px){.isoroom{min-height:112px;font-size:11px}.isofloor{gap:5px;margin:8px 0 26px}.isoroom .emoji{font-size:24px}.archmap{padding:20px 8px 24px}}
</style></head><body><header><div style="max-width:1080px;margin:auto"><small>VIRTUAL HEADQUARTERS · VER.7</small><h1>HIKKE AI LABO</h1><p>立体フロアマップ統合版 · 3フロア / 9部屋</p></div></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div id="app"></div><footer>HIKKE AI LABO · 仮想本社 Ver.7<br>この画面は端末内で動作する試作版です。業務の自動実行やクラウド保存はありません。</footer></main><script>
const IMG={"hikkya": "mascot.jpg", "mascot": "mascot.jpg", "group": "group.jpg", "himari": "himari.jpg", "kokoa": "kokoa.jpg", "ruka": "ruka.jpg"};
const FLOORS={'1F':['受付・ラウンジ','社長室','販売管理室'],'2F':['リサーチ室','SNS運用室','データ分析室'],'3F':['企画会議室','記事制作室','品質管理室']};
const PEOPLE=[{id:'hikkya',name:'ヒッキャ',role:'公式マスコット・受付案内',floor:'1F',room:'受付・ラウンジ',tasks:['本社・各部署の案内','ブランド紹介','受付サポート']},{id:'himari',name:'陽葵',role:'SNS・マーケティング／広告モデル',floor:'2F',room:'SNS運用室',tasks:['SNS投稿の企画','広告モデルとしての活動','ブランド発信の確認']},{id:'kokoa',name:'心愛',role:'企画・クリエイティブ／広告モデル',floor:'3F',room:'企画会議室',tasks:['note記事の企画','広告クリエイティブの検討','広告モデルとしての活動']},{id:'ruka',name:'瑠夏',role:'記事制作・品質管理／広告モデル',floor:'3F',room:'品質管理室',tasks:['記事の品質確認','文章編集の検討','広告モデルとしての活動']}];
let page='office',floor='3F',room='企画会議室',person='kokoa';let memo='企画案を13の専門役割から検討し、最終案を統合する。';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function selectPage(p){if(page==='memo'){memo=$('#memo')?.value??memo}page=p;render()}
function chooseFloor(f){floor=f;room=FLOORS[f][0];render()}
function chooseRoom(r){room=r;render()}
function choosePerson(id){person=id;page='staff';render()}
function goRoom(){const p=PEOPLE.find(x=>x.id===person);floor=p.floor;room=p.room;page='office';render()}
function copyMemo(){memo=$('#memo').value;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(memo).then(()=>$('#notice').textContent='コピーしました').catch(()=>fallback())}else fallback();function fallback(){$('#memo').select();$('#notice').textContent='テキストを選択しました。長押しでコピーしてください。'}}
function render(){const tabs=[['office','🏢 オフィス'],['staff','👥 社員名簿'],['memo','📝 会議メモ']];$('#tabs').innerHTML=tabs.map(([id,label])=>`<button class="${page===id?'active':''}" onclick="selectPage('${id}')">${label}</button>`).join('');const p=PEOPLE.find(x=>x.id===person);let out='';if(page==='office'){out=`<div class="layout"><div><section class="panel"><div class="floors">${Object.keys(FLOORS).map(f=>`<button class="${f===floor?'active':''}" onclick="chooseFloor('${f}')">${f}</button>`).join('')}</div><strong>${floor}｜フロアマップ</strong><div class="archmap"><div class="maplabel">タップして部屋へ入室 ↘</div><div class="isofloor">${FLOORS[floor].map((r,i)=>`<button class="isoroom ${r===room?'selected':''}" onclick="chooseRoom('${r}')"><span class="emoji">${['🏢','💻','📊'][i]}</span>${r}</button>`).join('')}</div></div></section><section class="panel"><strong>在籍メンバー</strong><div style="margin-top:10px">${PEOPLE.filter(x=>x.room===room).map(x=>`<button class="action" onclick="choosePerson('${x.id}')">${x.name} のプロフィールを見る</button>`).join('')||'<p class="sub">登録済みの広告モデル・マスコットはありません。</p>'}</div></section></div><section class="panel"><div class="roomname">${room}</div><div class="roomscene"><div class="scene-window"></div><div class="scene-desk"><i>💻</i><i>📋</i><i>🪴</i></div><div class="scene-title">${room} · イメージ図</div></div><p class="scene-tag">室内はレイアウト確認用のイラストです。リアルな専用室内写真は未制作。</p><h3 style="margin-bottom:8px">公式キャラクター</h3><img class="hero" src="${room==='受付・ラウンジ'?IMG.mascot:IMG.group}" alt="HIKKE AI LABO公式ビジュアル"><div class="roompeople">${PEOPLE.filter(x=>x.room===room || room==='企画会議室' && x.id!=='hikkya').map(x=>`<button onclick="choosePerson('${x.id}')"><img src="${IMG[x.id]}" alt="${x.name}">${x.name}</button>`).join('')||'<span class="sub">この部屋に登録されたモデルはいません。</span>'}</div>${room==='企画会議室'?'<h3>企画会議室｜公式メンバー</h3><div class="staffgrid">'+PEOPLE.map(x=>`<button class="person" onclick="choosePerson('${x.id}')"><img src="${IMG[x.id]}" alt="${x.name}">${x.name}</button>`).join('')+'</div>':''}</section></div>`}else if(page==='staff'){out=`<section class="panel"><h3>公式キャラクター・社員名簿</h3><div class="staffgrid">${PEOPLE.map(x=>`<button class="person ${person===x.id?'active':''}" onclick="choosePerson('${x.id}')"><img src="${IMG[x.id]}" alt="${x.name}">${x.name}</button>`).join('')}</div></section><section class="panel"><div class="profile"><img src="${IMG[p.id]}" alt="${p.name}公式画像"><div><h2>${p.name}</h2><span class="pill">${p.role}</span><p>📍 ${p.floor}・${p.room}</p><strong>担当業務</strong>${p.tasks.map(t=>`<div class="task">${t}</div>`).join('')}</div></div><button class="action" onclick="goRoom()">${p.name}の担当部署へ移動 →</button></section>`}else{out=`<section class="panel"><h3>企画会議室｜会議メモ</h3><textarea id="memo" oninput="memo=this.value">${esc(memo)}</textarea><button class="action" onclick="copyMemo()">会議メモをコピー</button><p id="notice">メモはこのページを閉じると消える可能性があります。必要に応じてコピーしてください。</p></section>`}$('#app').innerHTML=out}
render();</script></body></html>
